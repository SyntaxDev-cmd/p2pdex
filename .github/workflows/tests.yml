name: Testes de telas

on:
  push:
    branches: ["claude/**"]
    paths: ["android/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes (Robolectric)
        run: |
          chmod +x gradlew
          ./gradlew :app:testFullDebugUnitTest --no-daemon --continue 2>&1 | tail -40 || true
      - name: Resultado
        if: always()
        run: |
          for f in app/build/test-results/testFullDebugUnitTest/*.xml; do
            echo "=== $f"
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse(sys.argv[1]).getroot()
          print("testes:", t.get("tests"), "falhas:", t.get("failures"), "erros:", t.get("errors"))
          for tc in t.iter("testcase"):
              for tag in ("failure", "error"):
                  for e in tc.iter(tag):
                      print("----", tc.get("name"), tag)
                      print((e.text or "")[:6000])
          out = t.find("system-err")
          if out is not None and out.text:
              lines = [l for l in out.text.splitlines() if "Exception" in l or "at com.novatv" in l or "Caused by" in l]
              print("\n".join(lines[:120]))
          PY
          done
