name: Laboratório Windows (teste + pacote)

# Testa o laboratório num Windows de verdade (janela, instalação do Java/SDK e geração
# do NovaTV e do NovaSports) e publica o pacote pronto em Releases → "laboratorio".
on:
  push:
    branches: [main, "claude/**"]
    paths: ["tools/**", "LABORATORIO.bat", "TUTORIAL-LABORATORIO.txt", "android/**", "sports/**", "roku/**", ".github/workflows/lab-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe do script
        shell: powershell
        run: |
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\laboratorio.ps1", [ref]$t, [ref]$e)
          if ($e) { $e | ForEach-Object { Write-Host "::error::linha $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "sintaxe OK"

      - name: Janela monta sem erro
        shell: powershell
        run: |
          $o = powershell -NoProfile -ExecutionPolicy Bypass -STA -File tools\laboratorio.ps1 -Task guitest 2>&1 | Out-String
          Write-Host $o
          if ($o -notmatch "@@GUI-OK@@") { exit 1 }

      - name: Instalar/atualizar numa pasta do PC (com backup)
        shell: powershell
        run: |
          # 1) pasta vazia com espaço no nome
          $d1 = "$env:RUNNER_TEMP\LABORATORIO APP DEXONDEV"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\laboratorio.ps1 -Task install -Arg "$d1"
          if (-not (Test-Path "$d1\tools\laboratorio.ps1") -or -not (Test-Path "$d1\android\gradlew.bat")) { Write-Host "::error::instalação incompleta"; exit 1 }
          # 2) atualizar por cima: o que existia vai para backup, perfis/chave ficam
          New-Item -ItemType Directory "$d1\perfis" -Force | Out-Null; Set-Content "$d1\perfis\x.json" "{}"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\laboratorio.ps1 -Task install -Arg "$d1"
          if (-not (Get-ChildItem "$d1\ferramentas\backup" -Directory)) { Write-Host "::error::sem backup"; exit 1 }
          if (-not (Test-Path "$d1\perfis\x.json")) { Write-Host "::error::perfis apagados"; exit 1 }
          # 3) pasta de outro laboratório: não mexe, instala em NOVA-LAB
          $d2 = "$env:RUNNER_TEMP\outro lab"
          New-Item -ItemType Directory "$d2\tools" -Force | Out-Null; Set-Content "$d2\tools\meu.txt" "nao mexer"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\laboratorio.ps1 -Task install -Arg "$d2"
          if ((Get-Content "$d2\tools\meu.txt") -ne "nao mexer") { Write-Host "::error::alterou arquivos de outro laboratório"; exit 1 }
          if (-not (Test-Path "$d2\NOVA-LAB\tools\laboratorio.ps1")) { Write-Host "::error::NOVA-LAB não criada"; exit 1 }
          Write-Host "instalação/atualização OK"

      - name: Gerar NovaTV e NovaSports pelo laboratório (instala Java + SDK sozinho)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force perfis | Out-Null
          $logo = "$PWD\android\app\src\main\res\drawable-nodpi\app_logo.png"
          $bg = (Get-ChildItem "$PWD\android\app\src\main\res\drawable-nodpi" -Filter "app_background.*" | Select-Object -First 1).FullName
          $apps = @(
            @{ app = "NovaTV"; label = "Lab Teste TV"; id = "com.labteste.tv"; play = $false },
            @{ app = "NovaSports"; label = "Lab Teste Sports"; id = "com.labteste.sports"; play = $false },
            @{ app = "NovaKids"; label = "Lab Teste Kids"; id = "com.labteste.kids"; play = $true },
            @{ app = "Roku - NovaTV"; label = "Lab Teste Roku"; id = "com.labteste.roku"; play = $false },
            @{ app = "Roku - Kids"; label = "Lab Teste RokuKids"; id = "com.labteste.rokukids"; play = $false }
          )
          foreach ($a in $apps) {
            $p = [ordered]@{ app = $a.app; label = $a.label; id = $a.id; panel = "https://exemplo.com"; key = ""; reseller = "TESTE";
                             logo = $logo; icon = ""; background = $bg; color = "#102040"; version = 1; play = $a.play }
            $pf = "$PWD\perfis\$($a.id).json"
            [IO.File]::WriteAllText($pf, ($p | ConvertTo-Json))
            $log = "$PWD\lab-$($a.id).log"
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\laboratorio.ps1 -Task build -Arg $pf -LogFile $log
            Get-Content $log -Encoding UTF8
            if (-not (Select-String -Path $log -Pattern "@@OK@@" -Quiet)) { Write-Host "::error::Laboratório falhou ao gerar $($a.app)"; exit 1 }
          }
          Get-ChildItem SAIDA
          if ((Get-ChildItem SAIDA -Filter *.apk).Count -lt 3) { Write-Host "::error::APKs não encontrados em SAIDA"; exit 1 }
          if ((Get-ChildItem SAIDA -Filter *.aab).Count -lt 1) { Write-Host "::error::AAB (Google Play) não gerado"; exit 1 }
          if ((Get-ChildItem SAIDA -Filter *-roku-*.zip).Count -lt 2) { Write-Host "::error::pacotes Roku não gerados"; exit 1 }

      - name: Projeto voltou ao original depois de gerar
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- android sports roku)" || { echo "::error::o laboratório deixou arquivos de marca alterados"; exit 1; }

      - name: Conferir marca dentro do APK
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apk = Get-ChildItem SAIDA -Filter "LabTesteTV*.apk" | Select-Object -First 1
          $z = [IO.Compression.ZipFile]::OpenRead($apk.FullName)
          $cfg = $z.Entries | Where-Object { $_.FullName -eq "assets/config.json" }
          $txt = (New-Object IO.StreamReader($cfg.Open())).ReadToEnd(); $z.Dispose()
          Write-Host $txt
          if ($txt -notmatch "exemplo.com" -or $txt -notmatch "TESTE") { Write-Host "::error::config.json sem os dados do cliente"; exit 1 }
          function Read-Entry($file, $name) {
            $z = [IO.Compression.ZipFile]::OpenRead($file)
            try { $e = $z.Entries | Where-Object { $_.FullName -eq $name }; if (-not $e) { return $null }; return (New-Object IO.StreamReader($e.Open())).ReadToEnd() } finally { $z.Dispose() }
          }
          $kids = (Get-ChildItem SAIDA -Filter "LabTesteKids*.apk" | Select-Object -First 1).FullName
          $k = Read-Entry $kids "assets/config.json"
          if ($k -notmatch '"app_mode":\s*"kids"') { Write-Host "::error::NovaKids sem app_mode=kids: $k"; exit 1 }
          $roku = (Get-ChildItem SAIDA -Filter "LabTesteRokuKids-roku-*.zip" | Select-Object -First 1).FullName
          $man = Read-Entry $roku "manifest"
          $rc = Read-Entry $roku "config.json"
          Write-Host $man; Write-Host $rc
          if ($man -notmatch "title=Lab Teste RokuKids") { Write-Host "::error::manifest do Roku sem o nome"; exit 1 }
          if ($rc -notmatch '"app_mode":\s*"kids"' -or $rc -notmatch "exemplo.com") { Write-Host "::error::config do Roku errado"; exit 1 }
          if (-not (Read-Entry $roku "components/MainScene.brs")) { Write-Host "::error::zip do Roku sem barras /"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: laboratorio-apks-teste
          path: SAIDA/*.apk

  pacote:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o pacote do laboratório
        run: |
          mkdir -p out
          git archive --format=zip -o out/LABORATORIO-APP-DEXONDEV.zip HEAD \
            android sports roku tools LABORATORIO.bat ATUALIZAR.bat TUTORIAL-LABORATORIO.txt README.md
          unzip -l out/LABORATORIO-APP-DEXONDEV.zip | tail -1
      - name: Publicar
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laboratorio
          target_commitish: ${{ github.sha }}
          name: "Laboratório DEXONDEV (Windows) — pacote pronto"
          prerelease: true
          make_latest: false
          body: |
            Pacote do Laboratório DEXONDEV para Windows 10/11, testado automaticamente num Windows
            (gerou NovaTV e NovaSports) — commit ${{ github.sha }}.
            1. Baixe o ZIP, clique com o botão direito > Extrair tudo... > D:\LABORATORIO APP DEXONDEV
            2. Dois cliques em LABORATORIO.bat
            3. Leia o TUTORIAL-LABORATORIO.txt
            Link fixo: https://github.com/${{ github.repository }}/releases/download/laboratorio/LABORATORIO-APP-DEXONDEV.zip
          files: out/LABORATORIO-APP-DEXONDEV.zip
