name: Gerar APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
    inputs:
      panel_url:
        description: "URL do painel (ex.: https://seudominio.com/painel). Vazio = usa secret/gradle.properties"
        required: false
      panel_key:
        description: "Chave PANEL_KEY do painel. Vazio = usa secret/gradle.properties"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore (se configurada nos secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "Keystore própria encontrada."
          else
            echo "::warning::Sem KEYSTORE_BASE64 nos secrets: o APK será assinado com chave de debug (atualizações exigirão desinstalar)."
          fi

      - name: Compilar APK
        env:
          PANEL_URL: ${{ inputs.panel_url || secrets.PANEL_URL }}
          PANEL_KEY: ${{ inputs.panel_key || secrets.PANEL_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/NovaTV-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
