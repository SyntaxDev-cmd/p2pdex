org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ===== Configure aqui antes de gerar o APK =====
# Endereço onde o painel foi hospedado (sem barra no final)
PANEL_URL=https://seudominio.com/painel
# Chave mostrada em Painel > Visão geral (PANEL_KEY)
PANEL_KEY=COLE_A_CHAVE_AQUI
# Nome do app no launcher (o nome dentro do app vem do painel)
APP_LABEL=NovaTV
# ID único do app na Play Store / no aparelho
APP_ID=com.novatv.app
