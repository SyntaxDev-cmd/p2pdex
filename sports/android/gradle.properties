org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ===== Configure aqui antes de gerar o APK =====
# Endereço onde o painel foi hospedado (sem barra no final)
PANEL_URL=http://p2pwmax.dexdown.shop
# Chave da API (opcional: só se ativar "Exigir chave" no painel)
PANEL_KEY=
# Nome do app no launcher (o nome dentro do app vem do painel)
APP_LABEL=NovaSports
# ID único do app na Play Store / no aparelho
APP_ID=com.novatv.sports

# Não encurtar nomes de recursos no APK (res/drawable/x.png -> res/Ab.png):
# mantém as imagens visíveis e editáveis no APK Editor / MT Manager
android.enableResourceOptimizations=false
